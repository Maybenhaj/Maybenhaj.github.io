<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Three Cards Demo</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <div id="single-column">
            <!-- Flexbox container -->
            <div id="card-container">
                <!-- Flexbox item -->
                 <div class="card">
                    <h3>Happy Chinese NEW YEAR</h3>
                    <img src="images/chinese.png" alt="img">
                    <p>
                        Best wishes, wishing you happiness and prosperity. 
                 </div>
                 <!-- Flexbox item -->
                 <div class="card">
                    <h3>新年好 (xīn nián hǎo )</h3>
                    <img src="images/horseyear.webp" >
                    <p>
                        恭喜发财 马年兴旺，家庭团圆乐无边!

                    </p>
                </div>
               
            </div>
        </div>
     
    </body>
</html>
