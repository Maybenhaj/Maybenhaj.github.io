<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>responsive site</title>
        <link href="css/style.css" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link 
            href="https://fonts.googleapis.com/css2?family=Diplomata&display=swap" 
            rel="stylesheet"
        >
    </head>
    <body>
        <div id="nav">
            <a href="#" id="logo">Instants du Monde </a>
            <a href="#">Guides</a>
            <a href="#">About</a>
            <a href="#">Join Us</a>
        </div>
        <div id="single-column">
            <div id="hero">
                <div class="hero-content">
                    <h1>"Life is short and the world is wide."</h1>
                    
                </div>
            </div>
            <div class="gallery">
                
                <div class="basic-grid-gallery">
                    <img src="images/image1.jpg" alt="img">
                    <img src="images/image2.jpg" alt="img">
                    <img src="images/image3.jpg" alt="img">
                    <img src="images/image4.jpg" alt="img">
                    <img src="images/image5.jpg" alt="img">
                    <img src="images/image6.jpg" alt="img">
                    <img src="images/image7.jpg" alt="img">
                    <img src="images/image8.jpg" alt="img">
                    <img src="images/image9.jpg" alt="img">
                </div>
                
            </div>
            <div class="gallery">
                <div class="horizontal-masonry-gallery">
                    <img src="images/pic1.jpg" alt="img">
                    <div class="text"><h2> Travel far </h2></div>
                    <img src="images/pic2.jpg" alt="img">
                    
                    <img src="images/pic3.jpg" alt="img">
                    <img src="images/pic4.jpg" alt="img">
                    
                    <img src="images/pic5.jpg" alt="img">
                    <div class="text"><h2> Travel wide </h2></div>
                    <img src="images/pic6.webp" alt="img">
                    <img src="images/pic7.avif" alt="img">
                    <div class="text"><h2> Travel deep </h2></div>
                    <img src="images/pic8.jpg" alt="img">

                    <img src="images/pic9.jpg" alt="img">
                    
                </div>
            </div>
        </div>
    </body>
</html>
