<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>responsive site</title>
        <link href="css/style.css" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link 
            href="https://fonts.googleapis.com/css2?family=Diplomata&display=swap" 
            rel="stylesheet"
        >
        <link 
            rel="stylesheet" 
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" 
            integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A==" 
            crossorigin="anonymous" 
            referrerpolicy="no-referrer"
        >
    </head>
    <body>
        <div id="nav">
            <a href="#" class="name" >Photos by Jim </a>
            <a href="gallery.html">Gallery</a>
            <a href="#">Services</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
        <div id="single-column">
            <div id="hero">
                <div class="hero-content">
                    <h1>Photos by Jim</h1>
                    <a href="#gallery">View Gallery</a>
                </div>
            </div>
            <div id="gallery">
                
                <div class="basic-grid-gallery">
                    <img src="images/t-urban-11n8m.jpg" alt="img">
                    <img src="images/t-urban-14h7y.jpg" alt="img">
                    <img src="images/t-urban-15r57.jpg" alt="img">
                    <img src="images/t-urban-16ij4.jpg" alt="img">
                    <img src="images/t-urban-20vb1.jpg" alt="img">
                    <img src="images/t-urban-2b3sc.jpg" alt="img">
                    <img src="images/t-urban-5sn81.jpg" alt="img">
                    <img src="images/t-urban-8zu9s.jpg" alt="img">
                    <img src="images/t-urban-9mb73.jpg" alt="img">
                </div>
                
            </div>
            <div id="sidebyside">
                <div class="parent">
                    <div class="card">
                        <div class="content-box">
                            <h2 class="card-title">About</h2>
                            <a href="#">Learn More</a>
                        </div>
                        <div class="icon">
                            <i class="fa-solid fa-circle-info"></i>
                        </div>
                    </div>
                </div>
                <div class="parent">
                    <div class="card">
                        <div class="content-box">
                            <h2 class="card-title">Services</h2>
                            <a href="#">View Rates</a>
                        </div>
                        <div class="icon">
                            <i class="fa-solid fa-chart-area"></i>
                        </div>
                    </div>
                </div>
                <div class="parent">
                    <div class="card">
                        <div class="content-box">
                            <h2 class="card-title">Contact</h2>
                            <a href="#">Reach Out</a>
                        </div>
                        <div class="icon">
                            <i class="fa-solid fa-envelope"></i>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </body>
</html>
